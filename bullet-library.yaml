# bullet-library.yaml — master career library: the spine (roles, orgs, dates, teams) plus every
# experience bullet. Single source of truth for all career-experience facts.
# Schema: CONTEXT.md §5. Selection rules: build-variant / tailor-to-jd skills.
#
# Structure — four top-level keys:
#   tenure:      aggregate years-in-field claims used in resume summaries
#   roles:       one entry per role, reverse-chronological, each with its own bullets[]
#   cross-role:  bullets spanning several roles; render inside a role block or a leadership
#                summary line, never as a standalone role
#   internships: pre-career roles, listed only when a JD makes them relevant
#
# Role fields: title, org, dates, team, and optional context/management. team and management
# hold the durable people facts (size, composition, hires, promos, calibration, managed-out) —
# CONTEXT.md §1 holds the RULES for rendering them, not the facts themselves.
# Bullet fields: id, bullet, skills[], archetypes[]. Nothing else.
#
# Domain lives in skills[] as `e-commerce` / `healthcare` — there is no separate domain field.
# Use it to promote matching bullets when a JD is domain-specific.
#
# Seeded 2026-07-30 from the legacy CV plus facts confirmed in conversation; spine folded in
# from CONTEXT.md §1 on 2026-08-05.
# NO INVENTED CONTENT: bracketed placeholders like [X]% mark missing numbers. A bullet needing
# a fact from the candidate carries a `# TODO` comment as its last line, keyed to TODO.md §3
# where applicable; those bullets are not resume-ready until the question is answered.
#
# The skills-evidence matrix is GENERATED into skills-evidence-matrix.yaml — do not hand-edit
# it; regenerate after changing any skills[] field: python3 gen_matrix.py (from the repo root).

