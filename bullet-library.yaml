# bullet-library.yaml — master bullet library (single source of truth for experience bullets)
# Schema: CONTEXT.md §5. Selection rules: build-variant / tailor-to-jd skills.
#
# Structure: top-level keys are roles (vody / etsy / upmc-director / upmc-sds / cross-role);
# each maps to a list of bullets. Role is the grouping key, not a per-bullet field.
# Fields: id, bullet, skills[], archetypes[]. Nothing else.
#
# Domain lives in skills[] as `e-commerce` / `healthcare` — there is no separate domain field.
# Use it to promote matching bullets when a JD is domain-specific.
#
# Seeded 2026-07-30 from the legacy CV plus facts confirmed in conversation.
# NO INVENTED CONTENT: bracketed placeholders like [X]% mark missing numbers. A bullet needing
# a fact from the candidate carries a `# TODO` comment as its last line, keyed to TODO.md §3
# where applicable; those bullets are not resume-ready until the question is answered.
# Rewrites preserve the original claims exactly; only structure/wording changed.
#
# The legacy tool-dump bullet ("Utilized fine-tuned multimodal LLMs, RAG, CLIP, BERT, graph
# models served with vLLM, ANN, Kubernetes on AWS and GCP") is decomposed below into
# vody-attribute-tagging, vody-inference, vody-serving-stack; the last holds the tools whose
# outcomes are still unknown and carries a TODO until decomposed further.
#
# The skills-evidence matrix is GENERATED into skills-evidence-matrix.yaml — do not hand-edit
# it; regenerate after changing any skills[] field: python3 gen_matrix.py (from the repo root).

